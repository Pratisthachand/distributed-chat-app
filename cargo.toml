[package]
name = "dischat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "chat-server"
path = "server/main.rs"

[[bin]]
name = "chat-client"
path = "client/main.rs"